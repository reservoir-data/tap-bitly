name: Update Catalog for Bitly

on:
  workflow_dispatch:
  schedule:
  # On Fridays
  - cron: '0 12 * * 5'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  FORCE_COLOR: "1"
  # renovate: datasource=pypi depName=uv
  UV_VERSION: 0.13.8

jobs:
  update_openapi_specification:
    name: Update Catalog
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/create-github-app-token@v3.3.0
      id: generate-token
      with:
        permission-contents: write
        permission-pull-requests: write
        client-id: ${{ vars.RESERVOIR_GITHUB_APP_ID }}
        private-key: ${{ secrets.RESERVOIR_GITHUB_APP_PKEY }} # zizmor: ignore[secrets-outside-env]
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - uses: astral-sh/setup-uv@v10.3.3
      with:
        version: ${{ env.UV_VERSION }}
    - run: uv run scripts/update_openapi.py
    - id: check_snapshot_changes
      continue-on-error: true
      run: git diff --quiet tests/__snapshots__
    - uses: peter-evans/create-pull-request@v8.1.3
      if: steps.check_snapshot_changes.outcome == 'failure'
      with:
        title: 'fix: Update catalog'
        token: ${{ steps.generate-token.outputs.token }}
        signoff: true
