name: Build and publish

on:
  push:
    tags: ["*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build:
    name: Build wheel and sdist
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      package_version: ${{ steps.baipp.outputs.package_version }}
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - uses: hynek/build-and-inspect-python-package@v3.0.2
      id: baipp

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    environment:
      name: publishing
      url: https://pypi.org/project/tap-bitly/${{ needs.build.outputs.package_version }}
    needs: build
    permissions:
      id-token: write  # Needed for OIDC PyPI publishing
    steps:
    - uses: actions/download-artifact@v8.0.2
      with:
        name: Packages
        path: dist
    - uses: pypa/gh-action-pypi-publish@v1.14.3
